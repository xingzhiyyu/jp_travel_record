[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "travel-record"
version = "0.1.0"
description = "Render formatted travel logs as animated map videos."
requires-python = ">=3.10"
dependencies = [
  "Pillow>=11.0,<13",
  "imageio-ffmpeg>=0.6,<1",
  "shapely>=2.0,<3",
]

[project.scripts]
travel-record = "travel_record.cli:main"

[tool.setuptools.packages.find]
include = ["travel_record*"]

[tool.setuptools.package-data]
travel_record = ["data/*.json"]
